# ═══════════════════════════════════════════════════════════════════════════
# cms5 — Formular-Endpoint über die eigene Kundendomain weiterreichen
#
# Teil von deploy/nginx/, kommt mit dem Deploy. Der server-Block auf lara3 muss
# dafuer /var/www/gastro-ekg-website/current/deploy/nginx/*.conf einbinden.
# Uebernommen aus dem optware-Projekt, dort gleichlautend.
#
# WARUM das nötig ist:
#   Ohne die Weiterleitung holt der Browser das Formular direkt von
#   aracms5.aranes.de. Für einen Tracking-Schutz oder Werbeblocker ist das eine
#   Anfrage von der Kundendomain an eine fremde Domain — genau das Muster, nach
#   dem er sucht. Er unterbindet sie, der Besucher sieht gar kein Formular, und
#   niemand erfährt davon. Mit dieser Weiterleitung bleibt für den Browser
#   alles auf einer Domain.
#
# WARUM über 127.0.0.1:
#   cms5 glaubt die echte Besucheradresse aus X-Forwarded-For nur der
#   Loopback-Adresse (bootstrap/app.php). Ohne sie zählte sein Spam-Schutz alle
#   Besucher als einen und sperrte das Formular nach fünf Anfragen für alle.
#
# Der Pfad ist bewusst nicht auf einen Mandanten eingeengt: Der Abruf ist
# ohnehin öffentlich, und wer beim Absenden welche Domain benutzen darf,
# entscheidet `allowed_origins` am Formular in cms5 — dort gehört es hin.
# ═══════════════════════════════════════════════════════════════════════════

# `^~`: Ein Regex-Block (Bilder, CSS, HTML) darf hier nicht
# dazwischenkommen - sonst liefe eine Adresse mit passender Endung in try_files.
location ^~ /api/ {
    proxy_pass https://127.0.0.1:443;
    proxy_ssl_server_name on;
    proxy_ssl_name aracms5.aranes.de;
    proxy_set_header Host aracms5.aranes.de;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Formulare koennen Dateien tragen (Bewerbungsunterlagen). Ohne diese
    # Angabe gilt nginx' Standard von 1 MB, und ein groesserer Upload endet in
    # einem nackten 413, das der Besucher nicht versteht. Die eigentlichen
    # Grenzen setzt cms5 je Feld - hier steht nur der grobe Deckel.
    client_max_body_size 64M;

    # Ist cms5 aus, soll die Seite nicht ewig warten.
    proxy_connect_timeout 5s;
    proxy_read_timeout    15s;
}
