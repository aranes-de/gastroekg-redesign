# ═══════════════════════════════════════════════════════════════════════════
# Videos aus der alten WordPress-Mediathek (Umzug von wp9, 2026-10-29)
#
# Teil von deploy/nginx/, kommt mit dem Deploy. Die Dateien selbst liegen NICHT
# im Repo (zusammen gut 130 MB), sondern auf lara3 ausserhalb der Releases:
#   /var/www/gastro-ekg-website/media/wp-content/uploads/...
# Der Pfad ist derselbe wie auf WordPress - site.videoBase bleibt so, und auch
# alte externe Links auf die Videos laufen weiter.
#
# `^~`: Ein Regex-Block fuer Dateiendungen darf hier nicht dazwischenkommen,
# sonst suchte nginx die .mp4 im Release statt in media/.
# ═══════════════════════════════════════════════════════════════════════════

location ^~ /wp-content/uploads/ {
    root /var/www/gastro-ekg-website/media;
    expires 30d;
    add_header Cache-Control "public";
}
