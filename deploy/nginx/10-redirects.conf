# ═══════════════════════════════════════════════════════════════════════════
# Weiterleitungen alter WordPress-Adressen (Umzug von wp9, 2026-10-29)
#
# Teil von deploy/nginx/, kommt mit dem Deploy - wie 20-cms5-forms.conf.
# Nur Adressen, die es auf der neuen Seite nicht mehr gibt. /mitglied-werden
# war auf WordPress nur ein Kontaktformular, deshalb geht es auf #kontakt -
# dorthin zeigen auch die "Mitglied werden"-Buttons der Startseite.
# ═══════════════════════════════════════════════════════════════════════════

location ~ ^/mitglied-werden/?$ {
    return 301 /#kontakt;
}
